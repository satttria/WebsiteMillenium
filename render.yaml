services:
  - type: web
    name: laravel-app
    env: docker
    plan: free
    region: singapore
    branch: main
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      # tambahkan variabel .env lainnya di sini
